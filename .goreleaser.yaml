version: 2

project_name: appflowy

before:
  hooks:
    - go install github.com/google/go-licenses@v1.6.0
    - bash scripts/generate-third-party-notices.sh

builds:
  - id: appflowy
    main: ./cmd/appflowy
    binary: appflowy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X=github.com/swtormy-agents/appflowy-cli/internal/cli.Version={{.Version}}
      - -X=github.com/swtormy-agents/appflowy-cli/internal/cli.Commit={{.Commit}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES
      - src: third_party_licenses/**

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

release:
  draft: true
  mode: replace
  header: |
    **Disclaimer:** appflowy-cli is unofficial and not affiliated with or endorsed by AppFlowy.
